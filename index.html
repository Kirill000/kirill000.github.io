  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Рисуй онлайн — просто рисуй</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none; /* предотвращаем выделение при рисовании */
    }

    body {
      background: #1e1e2f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }

    .canvas-container {
      background: #0b0b12;
      border-radius: 32px;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 24px 24px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      max-width: 100%;
      transition: box-shadow 0.2s;
    }

    .canvas-container:hover {
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    canvas {
      display: block;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05), 0 8px 20px rgba(0, 0, 0, 0.4);
      cursor: crosshair;
      width: 100%;
      height: auto;
      max-width: 900px;
      aspect-ratio: 3 / 2;
      touch-action: none; /* отключаем прокрутку/жесты на холсте */
      transition: filter 0.1s;
    }

    /* Панель управления */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #1a1a28;
      padding: 14px 28px;
      border-radius: 60px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 12px 18px -8px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      color: #e0e0f0;
      width: fit-content;
      max-width: 100%;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tool-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #b9b9dd;
    }

    input[type="color"] {
      width: 44px;
      height: 44px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      padding: 2px;
      transition: all 0.15s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    }

    input[type="color"]:hover {
      border-color: #7f7fd0;
      transform: scale(1.02);
    }

    input[type="range"] {
      width: 140px;
      height: 6px;
      -webkit-appearance: none;
      background: #2f2f42;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 10px #00000080;
      border: 2px solid #5e5ea0;
      transition: 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #d0d0ff;
      transform: scale(1.1);
    }

    #sizeValue {
      min-width: 36px;
      text-align: center;
      font-weight: 600;
      font-size: 1rem;
      color: #ffffff;
      background: #29293d;
      padding: 6px 10px;
      border-radius: 40px;
      box-shadow: inset 0 1px 3px #00000055;
    }

    button {
      background: #2f2f48;
      border: none;
      color: #f0f0ff;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 26px;
      border-radius: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 0 #0f0f1a, 0 6px 12px #00000060;
      transition: all 0.08s ease;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0f0f1a, 0 6px 12px #00000060;
    }

    button:hover {
      background: #3d3d60;
      color: white;
    }

    .clear-btn {
      background: #3a2a3a;
      box-shadow: 0 6px 0 #1a0f1a, 0 6px 12px #00000060;
    }

    .clear-btn:hover {
      background: #5a3a5a;
    }

    /* Для мобильных */
    @media (max-width: 700px) {
      .canvas-container {
        padding: 16px 12px 16px 12px;
        border-radius: 24px;
      }

      .toolbar {
        padding: 12px 16px;
        gap: 16px;
        border-radius: 40px;
      }

      .tool-group {
        gap: 8px;
      }

      input[type="range"] {
        width: 100px;
      }

      button {
        padding: 10px 18px;
        font-size: 0.9rem;
      }

      canvas {
        border-radius: 16px;
      }
    }

    @media (max-width: 480px) {
      .toolbar {
        flex-direction: column;
        gap: 12px;
        border-radius: 30px;
        padding: 16px;
      }

      .tool-group {
        width: 100%;
        justify-content: space-between;
      }

      button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="canvas-container">
    <canvas id="drawingCanvas" width="900" height="600"></canvas>

    <div class="toolbar">
      <!-- Цвет -->
      <div class="tool-group">
        <label>
          <span>🎨</span>
          <input type="color" id="colorPicker" value="#1e1e2f">
        </label>
      </div>

      <!-- Толщина кисти -->
      <div class="tool-group">
        <label>
          <span>✏️</span>
          <input type="range" id="sizeSlider" min="1" max="50" value="8">
        </label>
        <span id="sizeValue">8</span>
      </div>

      <!-- Кнопка очистки -->
      <div class="tool-group">
        <button class="clear-btn" id="clearButton">
          <span>🗑️</span> Очистить
        </button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('drawingCanvas');
      const ctx = canvas.getContext('2d');

      // Элементы управления
      const colorPicker = document.getElementById('colorPicker');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const clearButton = document.getElementById('clearButton');

      // Текущие настройки рисования
      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;
      let currentColor = colorPicker.value;
      let currentSize = parseInt(sizeSlider.value, 10);

      // --- Инициализация холста ---
      function initCanvas() {
        // Белый фон (чтобы очистка работала предсказуемо)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Настройки линий по умолчанию
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentSize;
      }

      // --- Очистка холста ---
      function clearCanvas() {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // НЕ сбрасываем настройки цвета/толщины — пусть остаются текущими
        // Но если хотим, чтобы после очистки рисование продолжалось с теми же настройками,
        // просто заново применяем их (на случай, если контекст сбросился)
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }

      // --- Получение координат из события (мышь/тач) ---
      function getCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        // Масштаб: фактический размер canvas может отличаться от CSS (width/height в атрибутах)
        const scaleX = canvas.width / rect.width;   // например, 900 / 600 = 1.5
        const scaleY = canvas.height / rect.height;

        let clientX, clientY;

        if (e.touches) {
          // Для touch-событий берём первое касание
          if (e.touches.length === 0) return null;
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }

        // Преобразуем координаты окна в координаты canvas (с учётом масштаба)
        const canvasX = (clientX - rect.left) * scaleX;
        const canvasY = (clientY - rect.top) * scaleY;

        // Ограничиваем, чтобы не рисовать за пределами (не обязательно, но полезно)
        return {
          x: Math.min(Math.max(canvasX, 0), canvas.width),
          y: Math.min(Math.max(canvasY, 0), canvas.height)
        };
      }

      // --- Начало рисования ---
      function startDrawing(e) {
        e.preventDefault(); // предотвращаем прокрутку/выделение на тач-устройствах
        const coords = getCanvasCoords(e);
        if (!coords) return;

        isDrawing = true;
        lastX = coords.x;
        lastY = coords.y;

        // Начинаем путь
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        // Чтобы точка сразу появилась (для одиночного клика)
        ctx.lineTo(lastX, lastY);
        ctx.stroke();

        // Устанавливаем текущие стили (на всякий случай)
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }

      // --- Процесс рисования ---
      function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();

        const coords = getCanvasCoords(e);
        if (!coords) return;

        const currentX = coords.x;
        const currentY = coords.y;

        // Рисуем линию от последней точки к текущей
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(currentX, currentY);
        ctx.stroke();

        // Обновляем последнюю точку
        lastX = currentX;
        lastY = currentY;
      }

      // --- Остановка рисования ---
      function stopDrawing(e) {
        if (e) e.preventDefault();
        if (isDrawing) {
          isDrawing = false;
        }
      }

      // --- Обновление цвета ---
      colorPicker.addEventListener('input', (e) => {
        currentColor = e.target.value;
        ctx.strokeStyle = currentColor;
      });

      // --- Обновление толщины ---
      sizeSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        currentSize = parseInt(val, 10);
        sizeValue.textContent = val;
        ctx.lineWidth = currentSize;
      });

      // --- Очистка ---
      clearButton.addEventListener('click', clearCanvas);

      // --- Обработчики событий мыши ---
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseleave', stopDrawing); // если курсор ушёл с холста — прекращаем

      // --- Обработчики событий касаний (touch) ---
      canvas.addEventListener('touchstart', startDrawing, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stopDrawing);
      canvas.addEventListener('touchcancel', stopDrawing);

      // Предотвращаем контекстное меню на холсте (мешает при рисовании правой кнопкой)
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      // --- Инициализация ---
      initCanvas();

      // Устанавливаем начальное значение толщины в UI (синхронизация)
      sizeValue.textContent = sizeSlider.value;

      // Функция для сброса размера canvas при изменении окна не нужна,
      // т.к. мы используем фиксированные размеры canvas (900x600) и CSS-масштабирование.
      // При изменении окна рисунок не сбрасывается.
      // При желании можно добавить сохранение, но не требуется по заданию.

      // Дополнительно: если пользователь меняет размер окна, координаты
      // пересчитываются через getBoundingClientRect в getCanvasCoords.
      // Это работает корректно.

      // Для удобства: если пользователь хочет начать рисовать заново,
      // кнопка "Очистить" заливает белым.

      // Небольшой хак: чтобы при первом рисовании не было "прыжка" из 0,0,
      // мы не инициализируем lastX/lastY до mousedown/touchstart.
      // Всё ок.

      // Также, чтобы линия не была слишком резкой при первом клике,
      // startDrawing рисует точку.

      // Добавим небольшую защиту: если пользователь отпустил мышь вне холста,
      // но isDrawing остался true — stopDrawing на mouseleave решает проблему.

      // Для тач-устройств: если палец ушёл за пределы холста, touchend не сработает,
      // но touchcancel или touchend вне холста? Мы добавили touchend на canvas,
      // но если палец уходит за пределы, touchend может не сработать.
      // Добавим глобальный обработчик touchend для страницы, чтобы сбросить isDrawing.
      window.addEventListener('touchend', (e) => {
        // Если рисование было активно, но touchend произошёл вне canvas,
        // всё равно останавливаем.
        if (isDrawing) {
          // Проверим, относится ли событие к canvas? Не обязательно — просто сбросим.
          // Но лучше предотвратить случайную остановку, если touchend на canvas уже обработан.
          // Однако дублирование не страшно.
          isDrawing = false;
        }
      });

      // Также сбросим isDrawing при потере фокуса окна
      window.addEventListener('blur', () => {
        isDrawing = false;
      });

    })();
  </script>
</body>
</html>
